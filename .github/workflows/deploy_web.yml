name: Deploy Flutter Web to GitHub Pages

on:
          push:
                    branches:
                              - master # Change this to your default branch if it's different (e.g., master)

jobs:
          build_and_deploy:
                    runs-on: ubuntu-latest

                    steps:
                              - name: Checkout repository
                                uses: actions/checkout@v3

                              - name: Set up Flutter
                                uses: subosito/flutter-action@v2
                                with:
                                          channel: "stable" # or 'beta', 'master' depending on what you use

                              - name: Install dependencies
                                run: flutter pub get

                              - name: Build Web
                                # Replace <repository-name> with your GitHub repository name if this is a project page
                                # e.g., flutter build web --base-href "/DevPostBox/"
                                # If it's your username.github.io, leave it as "/"
                                run: flutter build web --release --base-href "/DevPostBox/"

                              - name: Deploy to GitHub Pages target branch
                                uses: peaceiris/actions-gh-pages@v3
                                with:
                                          github_token: ${{ secrets.GITHUB_TOKEN }}
                                          publish_dir: ./build/web
                                          publish_branch: web # Deploying strictly to the branch named "web"
